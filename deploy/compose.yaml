# The whole stack on one machine: PostgreSQL, the API server and the frontend.
#
#   docker compose -f deploy/compose.yaml up --build
#   open http://localhost:8088
#
# Settings come from deploy/.env (git ignores it; Compose reads it on its own):
# copy deploy/.env.example and edit. Without it these are development defaults.
# For a real server, set POSTGRES_PASSWORD and put TLS in front of "web".
name: ax-portal

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ax
      POSTGRES_USER: ax
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ax}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ax -d ax"]
      interval: 2s
      timeout: 3s
      retries: 30

  # The frontend's nginx.conf proxies /api/ to http://ax-backend:8080/, so the
  # service keeps that name.
  ax-backend:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    environment:
      DATABASE_URL: postgres://ax:${POSTGRES_PASSWORD:-ax}@db:5432/ax
      RUST_LOG: ${RUST_LOG:-info}
      AX_SESSION_IDLE: ${AX_SESSION_IDLE:-24h}
      AX_SESSION_MAX: ${AX_SESSION_MAX:-7d}
      AX_SETUP_LINK_TTL: ${AX_SETUP_LINK_TTL:-72h}
      AX_LOGIN_ATTEMPTS: ${AX_LOGIN_ATTEMPTS:-5}
      AX_LOGIN_LOCKOUT: ${AX_LOGIN_LOCKOUT:-15m}
      AX_TIME_ZONE: ${AX_TIME_ZONE:-Asia/Seoul}
      AX_AI_PROVIDER: ${AX_AI_PROVIDER:-stub}
      AX_SCOPE_CHECK: ${AX_SCOPE_CHECK:-true}
      AX_ANTHROPIC_API_KEY: ${AX_ANTHROPIC_API_KEY:-}
      AX_ANTHROPIC_API_KEY_PRECHECK: ${AX_ANTHROPIC_API_KEY_PRECHECK:-}
      AX_ANTHROPIC_API_KEY_REPORT: ${AX_ANTHROPIC_API_KEY_REPORT:-}
      AX_ANTHROPIC_API_KEY_WORK: ${AX_ANTHROPIC_API_KEY_WORK:-}
      # Set, the AI jobs wait for the runner below instead of running here.
      AX_RUNNER_TOKEN: ${AX_RUNNER_TOKEN:-}
      AX_DRAFTS_PER_ACCOUNT: ${AX_DRAFTS_PER_ACCOUNT:-20}
      AX_PUBLIC_PATH: ${AX_PUBLIC_PATH:-/api}
      # Reads repository branches for the project form; read-only, not the runner's.
      AX_GITHUB_READ_TOKEN: ${AX_GITHUB_READ_TOKEN:-}
      AX_GITHUB_API: ${AX_GITHUB_API:-https://api.github.com}
      # Inside the "uploads" volume below.
      AX_UPLOAD_DIR: /var/lib/ax/uploads
    volumes:
      - uploads:/var/lib/ax/uploads
    depends_on:
      db:
        condition: service_healthy
    ports:
      # AX_API_PORT in .env: the host port; only this machine reaches it.
      - "127.0.0.1:${AX_API_PORT:-8080}:8080"

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      args:
        # Same commit as contract/SOURCE; scripts/sync-contract.sh updates both.
        FRONTEND_REF: ${FRONTEND_REF:-3273b5510c4072881f47654b248e58504c88bc2b}
    depends_on:
      - ax-backend
    ports:
      # AX_WEB_PORT in .env: the host port people open.
      - "${AX_WEB_PORT:-8088}:80"

  # The runner: Claude Code on clones of the projects' GitHub repositories.
  # Off by default; start it with
  #   docker compose -f deploy/compose.yaml --profile runner up -d --build
  # after setting AX_RUNNER_TOKEN, AX_GITHUB_TOKEN and the Claude keys in .env.
  ax-runner:
    profiles: ["runner"]
    build:
      context: ..
      dockerfile: deploy/runner.Dockerfile
    environment:
      AX_RUNNER_SERVER: http://ax-backend:8080
      AX_RUNNER_TOKEN: ${AX_RUNNER_TOKEN:-}
      AX_GITHUB_TOKEN: ${AX_GITHUB_TOKEN:-}
      AX_GITHUB_API: ${AX_GITHUB_API:-https://api.github.com}
      AX_ANTHROPIC_API_KEY: ${AX_ANTHROPIC_API_KEY:-}
      AX_ANTHROPIC_API_KEY_REPORT: ${AX_ANTHROPIC_API_KEY_REPORT:-}
      AX_ANTHROPIC_API_KEY_WORK: ${AX_ANTHROPIC_API_KEY_WORK:-}
      AX_RUNNER_TIMEOUT: ${AX_RUNNER_TIMEOUT:-30m}
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      - ax-backend
    restart: unless-stopped

volumes:
  db-data:
  uploads:
