name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The database tests (#[sqlx::test]) make a fresh database per test here.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ax
          POSTGRES_PASSWORD: ax
          POSTGRES_DB: ax
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ax -d ax"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      # Installs the toolchain and components named in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
        env:
          DATABASE_URL: postgres://ax:ax@localhost:5432/ax

  contract:
    name: contract matches the pinned frontend commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/sync-contract.sh --check

  secrets:
    name: no secrets in history
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  stack:
    name: compose stack works end to end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: docker compose -f deploy/compose.yaml up -d --build --wait
      - run: bash scripts/smoke.sh
      - if: failure()
        run: docker compose -f deploy/compose.yaml logs
      - if: always()
        run: docker compose -f deploy/compose.yaml down -v
