[workspace]
resolver = "3"
members = ["crates/contract", "crates/api"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/Dowon-Kim7949/ax-request-portal-server"
publish = false

[workspace.dependencies]
ax-contract = { path = "crates/contract" }

# Password hashing (Argon2id, 19 MiB) is slow without optimisation; the debug
# builds that tests use would spend seconds per sign-in.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
